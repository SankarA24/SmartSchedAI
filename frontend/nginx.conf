server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # React Router owns the routes, so any unknown path must fall through
    # to index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints its assets, so they are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;
}
